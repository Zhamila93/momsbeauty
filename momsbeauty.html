<!doctype html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mom's Beauty — сертификаты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F3EA; --card:#FFFFFF; --card-2:#F4EFE3;
  --ink:#16201A; --ink-2:#5A6A5E; --ink-3:#8D9A90;
  --line:#E2DACA; --line-2:#EFE9DC;
  --camel:#B08A2E;
  --brand:#14432B; --brand-2:#1C5C3A; --brand-ink:#F6F1E3;
  --gold:#C9A227; --gold-soft:#FBF3DC;
  --btn-bg:#14432B; --btn-fg:#FBF7EC;
  --ok:#1F7A4D; --ok-soft:#E1F2E7;
  --warn:#D08A16; --warn-soft:#FCEFD6;
  --dead:#121512; --dead-soft:#DED8CC;
  --gone:#9AA69C;
  --rust:#A33B2A;
  --sh:0 1px 2px rgba(20,40,28,.05), 0 10px 26px rgba(20,40,28,.06);
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1310; --card:#141D18; --card-2:#1A251F;
    --ink:#F0EADC; --ink-2:#A8B5AC; --ink-3:#7C8A81;
    --line:#26332C; --line-2:#1E2A23;
    --camel:#D9B94A;
    --brand:#0F3322; --brand-2:#1A4A2F; --brand-ink:#F3EEDF;
    --gold:#D9B94A; --gold-soft:#2A2415;
    --btn-bg:#D9B94A; --btn-fg:#12190F;
    --ok:#5FBE8B; --ok-soft:#16281E;
    --warn:#E8B45C; --warn-soft:#2B2213;
    --dead:#D6D0C2; --dead-soft:#1E2A23;
    --gone:#7C8A81;
    --rust:#DE7A63;
    --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
    --paper:#0C1310; --card:#141D18; --card-2:#1A251F;
  --ink:#F0EADC; --ink-2:#A8B5AC; --ink-3:#7C8A81;
  --line:#26332C; --line-2:#1E2A23;
  --camel:#D9B94A;
  --brand:#0F3322; --brand-2:#17son4A2F; --brand-ink:#F3EEDF;
  --gold:#D9B94A; --gold-soft:#2A2415;
  --btn-bg:#D9B94A; --btn-fg:#12190F;
  --ok:#5FBE8B; --ok-soft:#16281E;
  --warn:#E8B45C; --warn-soft:#2B2213;
  --dead:#D6D0C2; --dead-soft:#1E2A23;
  --gone:#7C8A81;
  --rust:#DE7A63;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:Manrope,ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:14.5px;line-height:1.55;letter-spacing:.004em;
  -webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
.disp{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300}
.lbl{font-size:11.5px;letter-spacing:.05em;color:var(--ink-3);font-weight:500}
.tiny{font-size:12px;color:var(--ink-3)}
.muted{color:var(--ink-2)}

.shell{display:block;min-height:100dvh}
.rail{display:none}
.main{padding:16px 16px 104px;max-width:1120px;margin:0 auto}
@media (min-width:980px){
  .shell{display:grid;grid-template-columns:250px minmax(0,1fr);align-items:start}
  .rail{display:block;position:sticky;top:0;height:100dvh;border-right:0;padding:30px 18px;background:var(--brand);color:var(--brand-ink)}
  .main{padding:34px 44px 70px}
  .tabbar{display:none!important}
}
.brand b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:23px;line-height:1.1}
.brand span{display:block;font-size:11px;letter-spacing:.07em;opacity:.7;margin-top:3px}
.brand{margin-bottom:30px}
.navlink{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:2px;border:0;border-radius:var(--r);
  background:transparent;cursor:pointer;color:inherit;opacity:.78;font-size:14px}
.navlink:hover{opacity:1;background:rgba(255,255,255,.08)}
.navlink[aria-current="true"]{opacity:1;background:rgba(255,255,255,.16);font-weight:500}
.navlink i{font-style:normal;display:inline-block;width:22px}
.railacts{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);display:grid;gap:8px}
.railfoot{position:absolute;bottom:24px;left:18px;right:18px;border-top:1px solid rgba(255,255,255,.18);padding-top:14px}
.rail .tiny,.rail .btn.ghost{color:inherit;opacity:.75}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
@media (min-width:980px){.topbar{display:none}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tab{border:0;background:transparent;padding:5px 2px;font-size:11px;color:var(--ink-3);cursor:pointer}
.tab[aria-current="true"]{color:var(--ink)}
.tab.accent{color:var(--brand-2)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:14px}
.wrap{display:flex;flex-wrap:wrap;gap:7px}
.sec{margin:28px 0 10px;font-size:11.5px;letter-spacing:.09em;color:var(--brand-2);font-weight:600;text-transform:uppercase}
.btn{border:1px solid var(--line);background:transparent;border-radius:var(--r);padding:10px 18px;font-size:13.5px;font-weight:500;
  cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg);box-shadow:var(--sh)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ghost{border-color:transparent;color:var(--ink-2);padding:8px 0}
.btn.danger{color:var(--rust)}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:transparent;border-radius:var(--r);padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
label.f{display:block;margin-bottom:15px}
label.f>span{display:block;font-size:11.5px;letter-spacing:.045em;color:var(--ink-3);margin-bottom:6px;font-weight:500}
.in{width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;font-size:15px}
.in:focus{outline:0;border-bottom-color:var(--gold);box-shadow:0 1px 0 var(--gold)}
select.in{appearance:none;padding-right:22px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 9px) 19px,calc(100% - 5px) 19px;background-size:4px 4px;background-repeat:no-repeat}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.bar{height:3px;background:var(--line-2);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--gold))}
.empty{text-align:center;padding:48px 20px;color:var(--ink-2)}
.empty b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:21px;color:var(--ink);margin-bottom:6px}
.err{border-left:2px solid var(--rust);color:var(--rust);padding:8px 0 8px 12px;font-size:13px;margin-bottom:16px}

.hero{border-bottom:1px solid var(--line);padding-bottom:24px}
.hero .big{color:var(--brand);font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(2.8rem,12vw,4.8rem);line-height:1;margin:10px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:20px}
.kpi{background:var(--card);padding:16px 17px}
.kpis{box-shadow:var(--sh)}
.kpi .v{color:var(--brand)}
.kpi .v{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:25px;line-height:1.15;margin-top:4px}
.brow{padding:13px 0;border-bottom:1px solid var(--line-2)}
.brow:last-child{border-bottom:0}
.brow .top{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.brow .vv{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px}
.fitem{display:grid;grid-template-columns:1fr auto;gap:3px 14px;padding:12px 0;border-bottom:1px solid var(--line-2);align-items:baseline}
.fitem:last-child{border-bottom:0}
.fitem .amt{font-family:"Cormorant Garamond",Georgia,serif;font-size:18px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.kv:last-child{border-bottom:0}

/* список сертификатов с цветом */
.clist{border-top:1px solid var(--line)}
.crow{display:grid;grid-template-columns:minmax(92px,auto) minmax(0,1fr) auto;gap:3px 16px;align-items:center;
  width:100%;text-align:left;padding:14px 14px 14px 12px;border:0;border-bottom:1px solid var(--line-2);
  border-left:3px solid transparent;background:transparent;cursor:pointer;font:inherit;color:inherit}
.crow:hover{background:var(--card-2)}
.crow{background:var(--card)}
.clist{box-shadow:var(--sh);border-radius:var(--r);overflow:hidden}
.crow.s-active{border-left-color:var(--ok)}
.crow .no{color:var(--brand)}
.crow.s-partial{border-left-color:var(--warn)}
.crow.s-expired{border-left-color:var(--dead)}
.crow.s-used,.crow.s-void,.crow.s-stock{border-left-color:var(--line)}
.crow .no{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px}
.crow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .rt{text-align:right}
.crow .amt{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;display:block;margin-top:2px}
.crow .full{grid-column:1/-1;margin-top:8px}
@media (max-width:560px){.crow{grid-template-columns:1fr auto}.crow .no{font-size:19px}}
.st{font-size:11.5px;letter-spacing:.03em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st.active{color:var(--ok)}
.st.partial{color:var(--warn)}
.st.expired{color:var(--dead)}
.st.used,.st.void,.st.stock{color:var(--gone)}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}

.scrim{position:fixed;inset:0;background:rgba(24,21,17,.42);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.scrim{align-items:center;padding:26px}}
.sheet{background:var(--card);width:100%;max-width:540px;max-height:92dvh;overflow:auto;border:1px solid var(--line);
  border-radius:var(--r) var(--r) 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom))}
@media (min-width:720px){.sheet{border-radius:var(--r);padding:30px}}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sheethead h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:25px;line-height:1.15}
.x{border:0;background:transparent;cursor:pointer;font-size:17px;color:var(--ink-3);padding:0 2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:80;
  background:var(--btn-bg);color:var(--btn-fg);padding:12px 20px;border-radius:var(--r);font-size:13.5px;max-width:92vw}
@media (min-width:980px){.toast{bottom:30px}}
.toast.bad{background:var(--rust);color:#fff}

.gift{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 62%,#236B44 100%);
  color:var(--brand-ink);border-radius:var(--r);padding:24px 22px;margin-bottom:18px;
  box-shadow:0 14px 34px rgba(16,48,32,.28);border:1px solid rgba(201,162,39,.45);position:relative;overflow:hidden}
.gift:after{content:"";position:absolute;inset:8px;border:1px solid rgba(201,162,39,.30);border-radius:2px;pointer-events:none}
.gift .cap{color:var(--gold)}
.gift .num{color:#fff}
.gift .cap{font-size:10.5px;letter-spacing:.2em;opacity:.95;font-weight:600}
.gift .num{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:52px;line-height:1.02;margin-top:4px}
.gift .cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin-top:18px;
  border-top:1px solid rgba(255,255,255,.22);padding-top:14px}
.gift .cells .lbl{color:inherit;opacity:.72}
.gift .cells b{display:block;font-weight:500;font-size:15px;margin-top:3px}
.kindtabs{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.kindtabs button{border:0;background:transparent;padding:9px 16px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.kindtabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.gate{min-height:100dvh;display:grid;place-items:center;padding:26px}
.gatecard{width:100%;max-width:400px}
.gbrand{text-align:center;margin-bottom:30px}
.gbrand b{display:block;color:var(--brand);font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:34px;line-height:1.05}
.gbrand span{display:block;font-size:11px;letter-spacing:.09em;color:var(--ink-3);margin-top:7px}
.gtabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:22px}
.gtab{border:0;background:transparent;padding:11px 0;cursor:pointer;color:var(--ink-3);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.gtab[aria-current="true"]{color:var(--brand);border-bottom-color:var(--gold);font-weight:600}
</style>
</head>
<body class="notranslate" translate="no">
<div id="root"><div class="gate"><div class="tiny">Загрузка…</div></div></div>

<div id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => new Intl.NumberFormat("ru-RU").format(Math.round(Number(n)||0)) + " ₸";
const dfmt = new Intl.DateTimeFormat("ru-RU",{day:"2-digit",month:"short",year:"2-digit"});
const dtfmt = new Intl.DateTimeFormat("ru-RU",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const dt = s => { const d=new Date(s); return isNaN(d)?"—":dfmt.format(d); };
const dtt = s => { const d=new Date(s); return isNaN(d)?"—":dtfmt.format(d); };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const safeId = s => String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g,"-").slice(0,60) || "x";
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){} }
function ss(k,v){ try{ if(v===undefined) return sessionStorage.getItem(k); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v);}catch(e){} }
async function hashPass(pass, salt){
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("mb2:"+salt+":"+pass));
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function addMonths(d,m){ const x=new Date(d); const day=x.getDate(); x.setMonth(x.getMonth()+m); if(x.getDate()<day) x.setDate(0); return x; }
function isoDate(d){ const x=new Date(d); return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function nt(n){ return '<span translate="no" class="notranslate">'+esc(n)+'</span>'; }

const BRANCHES = [
  {id:"first",  name:"Mom's Beauty Mangilik El"},
  {id:"turan",  name:"Mom's Beauty Turan"},
  {id:"privat", name:"Mom's Private"}
];
const OLD_BRANCHES = { prouve:"Mom's Beauty Prouve", first:"Mom's Beauty Mangilik El", privat:"Mom's Private" };
const DEFAULTS = { validityMonths:12, nominals:[10000,20000,30000,50000,100000], signupCode:"MOMS2026" };

const S = {
  db:null, dl:null, boot:"loading", bootMsg:"",
  staff:[], certs:[], log:[], settings:null, loaded:{staff:false,certs:false},
  me:null, seeded:false, gate:{tab:"login", err:""},
  view:"home", period:"month", from:"", to:"", q:"", fStatus:"all", fBranch:"all", fKind:"all", det:false,
  modal:null, busy:false
};
const lease = () => (ss("mb_tab") || (ss("mb_tab", Math.random().toString(36).slice(2)), ss("mb_tab")));
function branchName(id){ const b = BRANCHES.find(b=>b.id===id); return b?b.name:(OLD_BRANCHES[id]||id||"—"); }
function allBranches(){
  const seen = new Set(BRANCHES.map(b=>b.id));
  const extra = [];
  const add = id => { if(id && !seen.has(id)){ seen.add(id); extra.push({id, name:branchName(id)}); } };
  for(const c of S.certs){ add(c.soldBranch); for(const r of (c.redemptions||[])) add(r.branch); }
  return BRANCHES.concat(extra);
}
function cfg(k){ const s=S.settings||{}; return (s[k]!==undefined && s[k]!==null && s[k]!=="") ? s[k] : DEFAULTS[k]; }

function statusOf(c){
  if(c.status==="void") return "void";
  if(c.status==="stock") return "stock";
  const bal=Number(c.balance)||0, nom=Number(c.nominal)||0;
  if(bal<=0) return "used";
  if(c.expiresAt && new Date(c.expiresAt) < new Date(new Date().toDateString())) return "expired";
  if(nom && bal<nom) return "partial";
  return "active";
}
const ST = {active:"Действует", partial:"Есть остаток", expired:"Срок истёк", used:"Использован", stock:"Бланк", void:"Аннулирован"};

const SUPA_URL = "https://orvrktlwdgzojblugmdm.supabase.co";
const SUPA_KEY = "sb_publishable_Wp35YfV7Rp6umwVXqie33g_BQzLcN_b";
function makeSupaDB(){
  const base = SUPA_URL + "/rest/v1/mb_docs";
  const H = { "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY, "Content-Type":"application/json" };
  const subs = [];
  let timer = null;
  const refresh = ()=> subs.slice().forEach(f=>{ try{ f(); }catch(e){} });
  const tickPoll = ()=>{ if(!timer) timer = setInterval(refresh, 5000); };
  async function rowsFor(prefix){
    const r = await fetch(base+"?path=like."+encodeURIComponent(prefix+"%")+"&select=path,data", {headers:H});
    if(!r.ok) throw new Error("Нет связи с базой ("+r.status+")");
    return r.json();
  }
  async function one(path){
    const r = await fetch(base+"?path=eq."+encodeURIComponent(path)+"&select=path,data", {headers:H});
    if(!r.ok) throw new Error("Нет связи с базой ("+r.status+")");
    const a = await r.json();
    return a[0] ? a[0].data : null;
  }
  async function put(path, data){
    const r = await fetch(base, {method:"POST",
      headers:Object.assign({}, H, {"Prefer":"resolution=merge-duplicates,return=minimal"}),
      body: JSON.stringify({path, data, updated_at:new Date().toISOString()})});
    if(!r.ok) throw new Error("Не удалось сохранить ("+r.status+")");
    refresh();
  }
  return {
    doc(path){
      return {
        async get(){ const d = await one(path); return {exists:!!d, data:()=>d||{}}; },
        async set(v){ await put(path, v); return true; },
        async update(v){ const d = await one(path) || {}; await put(path, Object.assign({}, d, v)); return true; },
        async delete(){
          const r = await fetch(base+"?path=eq."+encodeURIComponent(path), {method:"DELETE", headers:H});
          if(!r.ok) throw new Error("Не удалось удалить ("+r.status+")");
          refresh(); return true;
        },
        async acquire(){ return {acquired:true}; },
        onSnapshot(cb, err){
          const f = ()=> one(path).then(d=>cb({exists:!!d, data:()=>d||{}})).catch(e=>err&&err(e));
          subs.push(f); f(); tickPoll(); return ()=>{};
        }
      };
    },
    collection(name){
      const q={order:null, dir:"asc", lim:1000};
      const api={
        orderBy(f,d){ q.order=f; q.dir=d||"asc"; return api; },
        limit(n){ q.lim=n; return api; },
        onSnapshot(cb, err){
          const f = ()=> rowsFor(name+"/").then(rows=>{
            let docs = rows.map(r=>({id:r.path.slice(name.length+1), data:()=>r.data}));
            if(q.order) docs.sort((a,b)=>{ const x=a.data()[q.order], y=b.data()[q.order];
              return (x>y?1:x<y?-1:0)*(q.dir==="desc"?-1:1); });
            cb({docs:docs.slice(0,q.lim)});
          }).catch(e=>err&&err(e));
          subs.push(f); f(); tickPoll(); return ()=>{};
        }
      };
      return api;
    }
  };
}

function makeLocalDB(){
  const KEY="mb_local_db";
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } };
  const write=o=>{ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} };
  const subs=[];
  const notify=()=>subs.slice().forEach(f=>{ try{ f(); }catch(e){} });
  const snapDoc=path=>{ const d=read()[path]; return {exists:!!d, data:()=>d||{}}; };
  return {
    doc(path){
      return {
        async get(){ return snapDoc(path); },
        async set(v){ const o=read(); o[path]=v; write(o); notify(); return true; },
        async update(v){ const o=read(); o[path]=Object.assign({}, o[path]||{}, v); write(o); notify(); return true; },
        async delete(){ const o=read(); delete o[path]; write(o); notify(); return true; },
        async acquire(){ return {acquired:true}; },
        onSnapshot(cb){ const f=()=>cb(snapDoc(path)); subs.push(f); f(); return ()=>{}; }
      };
    },
    collection(name){
      const q={order:null, dir:"asc", lim:1000};
      const build=()=>{
        const o=read(), pref=name+"/";
        let docs=Object.keys(o).filter(k=>k.indexOf(pref)===0).map(k=>({id:k.slice(pref.length), data:()=>o[k]}));
        if(q.order) docs.sort((a,b)=>{ const x=a.data()[q.order], y=b.data()[q.order];
          return (x>y?1:x<y?-1:0)*(q.dir==="desc"?-1:1); });
        return {docs:docs.slice(0,q.lim)};
      };
      const api={
        orderBy(f,d){ q.order=f; q.dir=d||"asc"; return api; },
        limit(n){ q.lim=n; return api; },
        onSnapshot(cb){ const f=()=>cb(build()); subs.push(f); f(); return ()=>{}; }
      };
      return api;
    }
  };
}

async function reserveNumbers(count){
  const ref = S.db.doc("meta/counter");
  let got = await ref.acquire({holder:lease(), ttlMs:8000});
  if(!got.acquired){ await sleep(1400); got = await ref.acquire({holder:lease(), ttlMs:8000}); }
  if(!got.acquired) throw new Error("Сейчас кто-то другой выписывает сертификат. Подождите пару секунд.");
  const snap = await ref.get();
  const stored = snap.exists ? Number(snap.data().last)||0 : 0;
  const seen = S.certs.reduce((m,c)=>Math.max(m, Number(c.num)||0), 0);
  const from = Math.max(stored, seen) + 1;
  if(snap.exists) await ref.update({last: from+count-1}); else await ref.set({last: from+count-1});
  const out=[]; for(let i=0;i<count;i++) out.push(from+i);
  return out;
}

/* ---------- выборки ---------- */
function periodStart(){
  const now=new Date();
  if(S.period==="custom") return S.from ? new Date(S.from+"T00:00:00") : new Date(0);
  if(S.period==="today") return new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(S.period==="week") return new Date(Date.now()-7*864e5);
  if(S.period==="month") return new Date(Date.now()-30*864e5);
  return new Date(0);
}
function periodEnd(){
  if(S.period==="custom" && S.to) return new Date(S.to+"T23:59:59");
  return new Date(8640000000000000);
}
function events(scope){
  const out=[];
  for(const c of S.certs){
    if(c.soldAt && c.status!=="stock") out.push({t:"sale",at:c.soldAt,cert:c,amount:Number(c.nominal)||0,branch:c.soldBranch,who:c.soldByName});
    for(const r of (c.redemptions||[])) out.push({t:"red",at:r.at,cert:c,amount:Number(r.amount)||0,branch:r.branch,who:r.byName,note:r.note});
  }
  return out.filter(e=>!scope || e.branch===scope).sort((a,b)=> new Date(b.at) - new Date(a.at));
}
function stats(scope){
  const from = periodStart(), to = periodEnd(), ev = events(scope);
  let sold=0, soldN=0, red=0, redN=0;
  const byBranch={}, byStaff={}, byStaffRed={};
  for(const b of allBranches()) byBranch[b.id]={sold:0,soldN:0,red:0,redN:0,liab:0,liabN:0};
  for(const e of ev){
    const at = new Date(e.at);
    if(at < from || at > to) continue;
    if(e.t==="sale"){ sold+=e.amount; soldN++; if(byBranch[e.branch]){ byBranch[e.branch].sold+=e.amount; byBranch[e.branch].soldN++; } byStaff[e.who||"—"]=(byStaff[e.who||"—"]||0)+e.amount; }
    if(e.t==="red"){ red+=e.amount; redN++; if(byBranch[e.branch]){ byBranch[e.branch].red+=e.amount; byBranch[e.branch].redN++; } byStaffRed[e.who||"—"]=(byStaffRed[e.who||"—"]||0)+e.amount; }
  }
  let liab=0, liabN=0, exp=0, expN=0, part=0, partN=0, usedN=0, allSold=0, allUsed=0;
  for(const c of S.certs){
    const st=statusOf(c), bal=Number(c.balance)||0, nom=Number(c.nominal)||0;
    if(st==="stock"||st==="void") continue;
    if(scope && c.soldBranch!==scope) continue;
    allSold+=nom; allUsed+=(c.redemptions||[]).reduce((s,r)=>s+(Number(r.amount)||0),0);
    if(st==="active"||st==="partial"){ liab+=bal; liabN++; if(byBranch[c.soldBranch]){ byBranch[c.soldBranch].liab+=bal; byBranch[c.soldBranch].liabN++; } }
    if(st==="partial"){ part+=bal; partN++; }
    if(st==="expired"){ exp+=bal; expN++; }
    if(st==="used") usedN++;
  }
  return {sold,soldN,red,redN,byBranch,byStaff,byStaffRed,liab,liabN,exp,expN,part,partN,usedN,allSold,allUsed,ev};
}
function visibleCerts(){
  const q = S.q.trim().toLowerCase();
  return S.certs.filter(c=>{
    const st = statusOf(c);
    if(S.fStatus==="all" ? st==="stock" : S.fStatus!==st) return false;
    if(S.fBranch!=="all" && c.soldBranch!==S.fBranch) return false;
    if(!q) return true;
    return [c.number,c.toName,c.toPhone,c.fromName,c.fromPhone,c.soldByName,c.note].some(v=>String(v||"").toLowerCase().includes(q));
  });
}
function findByNumber(str){
  const raw = String(str||"").trim().toLowerCase().replace(/\s/g,"");
  if(!raw) return null;
  const exact = S.certs.find(c=>String(c.number).toLowerCase()===raw);
  if(exact) return exact;
  const d = raw.replace(/\D/g,"");
  if(!d) return null;
  const n = Number(d);
  return S.certs.find(c=>Number(String(c.number).replace(/\D/g,""))===n) || null;
}

async function doSell(v){
  const now = new Date().toISOString();
  const patch = { nominal:v.nominal, balance:v.nominal, status:"active",
    fromName:v.fromName, fromPhone:v.fromPhone, toName:v.toName, toPhone:v.toPhone,
    soldBranch:v.branch, soldById:S.me.id, soldByName:S.me.name, soldAt:now,
    expiresAt:v.expiresAt, note:v.note, redemptions:[] };
  let number;
  if(v.blankId){
    const ref = S.db.doc("certs/"+v.blankId);
    const got = await ref.acquire({holder:lease(), ttlMs:9000});
    if(!got.acquired) throw new Error("Этот бланк сейчас оформляет другой администратор.");
    const snap = await ref.get();
    if(!snap.exists) throw new Error("Бланк не найден.");
    if(snap.data().status!=="stock") throw new Error("Этот бланк уже продан.");
    number = snap.data().number;
    await ref.update(patch);
  }else{
    const [num] = await reserveNumbers(1);
    number = fmtNumber(num);
    await S.db.doc("certs/"+safeId(number)).set(Object.assign({number, num, createdAt:now}, patch));
  }
  await writeLog("Продажа", number+" · "+money(v.nominal)+" · "+branchName(v.branch)+(v.toName?" · "+v.toName:""));
  return number;
}
async function doRedeem(cert, amount, branch, note){
  const ref = S.db.doc("certs/"+cert.id);
  let got = await ref.acquire({holder:lease(), ttlMs:9000});
  if(!got.acquired){ await sleep(1200); got = await ref.acquire({holder:lease(), ttlMs:9000}); }
  if(!got.acquired) throw new Error("Этот сертификат сейчас проводит другой администратор. Повторите через несколько секунд.");
  const snap = await ref.get();
  if(!snap.exists) throw new Error("Сертификат не найден.");
  const d = snap.data();
  if(d.status==="void") throw new Error("Сертификат аннулирован.");
  const bal = Number(d.balance)||0;
  if(amount > bal) throw new Error("Сумма больше остатка. Остаток: "+money(bal));
  const list = (d.redemptions||[]).concat([{ at:new Date().toISOString(), amount, branch, byId:S.me.id, byName:S.me.name, note:note||"" }]);
  const nb = Math.round((bal-amount)*100)/100;
  await ref.update({ balance:nb, redemptions:list, status: nb<=0 ? "used" : "active" });
  await writeLog("Погашение", d.number+" · −"+money(amount)+" · "+branchName(branch)+" · остаток "+money(nb));
  return nb;
}

    const used = (c.redemptions||[]).reduce((s,r)=>s+(Number(r.amount)||0),0);

    return [c.number, (c.redemptions||[]).map(r=>r.note).filter(Boolean).join(", ")||c.service||"", ST[statusOf(c)], c.nominal||0, used, c.balance||0, c.fromName||"", c.fromPhone||"", c.toName||"", c.toPhone||"",

      c.expiresAt?new Date(c.expiresAt).toLocaleDateString("ru-RU"):"", c.note||"", hist];
  });
  const csv = "\uFEFF" + [head].concat(rows).map(r=>r.map(v=>{
    const s=String(v==null?"":v); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";")).join("\r\n");
  const name = "moms-beauty-"+isoDate(new Date())+".csv";
  if(S.dl){
    try{ await S.dl.save({filename:name, data:csv}); }
    catch(e){ if(e && e.code!=="declined") flash("Не удалось сохранить файл", true); }
    return;
  }
  try{
    const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
    const a = document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){ flash("Не удалось сохранить файл", true); }
}

let modalKey = null;
function renderModal(force){
  const m = S.modal;
  const key = m ? m.type+":"+(m.id||"") : null;
  if(!force && key===modalKey) return;
  modalKey = key;
  const host = $("#modal");
  if(!m){ host.innerHTML=""; return; }
  const act = document.activeElement;
  const fk = act && act.dataset ? act.dataset.k : null;
  let fpos = null;
  try{ fpos = act ? act.selectionStart : null; }catch(e){ fpos = null; }
  const inner = m.type==="sell" ? mSell(m) : m.type==="redeem" ? mRedeem(m) : m.type==="edit" ? mEdit(m) : m.type==="find" ? mFind(m) : m.type==="pass" ? mPass(m) : m.type==="reset" ? mReset(m) : mCert(m);
  host.innerHTML = '<div class="scrim" data-act="scrim"><div class="sheet">'+inner+'</div></div>';
  if(fk){
    const el = host.querySelector('[data-k="'+fk+'"]');
    if(el){ el.focus(); try{ el.setSelectionRange(fpos==null?el.value.length:fpos, fpos==null?el.value.length:fpos); }catch(e){} return; }
  }
  const first = host.querySelector("input:not([readonly]), select");
  if(first && window.matchMedia("(min-width:720px)").matches) first.focus();
}

function mRedeem(m){
  const c = m.id ? S.certs.find(x=>x.id===m.id) : (m.q ? findByNumber(m.q) : null);

              <span class="rt"><span class="st ${s2}">${ST[s2]}</span><span class="amt">${money(x.balance)}</span></span>
            </button>`; }).join("")

  <div class="card pad" style="margin:18px 0">

  <div class="card pad">

    ${(c.redemptions||[]).map(r=>`<div class="fitem"><span>Погашение<span class="tiny" style="display:block">${esc(r.byName||"—")} · ${nt(branchName(r.branch))} · ${dtt(r.at)}${r.note?" · "+esc(r.note):""}</span></span><span class="amt">−${money(r.amount)}</span></div>`).join("")}
    ${c.voidedAt?`<div class="fitem"><span>Аннулирован<span class="tiny" style="display:block">${esc(c.voidedByName||"—")} · ${dtt(c.voidedAt)}</span></span><span></span></div>`:""}
  </div>
  <div class="wrap" style="margin-top:20px">
    ${st!=="used"&&st!=="void"?`<button class="btn primary" data-act="redeem" data-id="${esc(c.id)}">Погасить</button>`:""}
    ${st!=="void"&&S.me.role==="owner"?`<button class="btn sm" data-act="edit" data-id="${esc(c.id)}">Изменить срок и филиал</button>`:""}
    ${st!=="void"&&S.me.role==="owner"?`<button class="btn sm danger" data-act="void" data-id="${esc(c.id)}">Аннулировать</button>`:""}

function mFind(m){

  const pick = S.certs.filter(x=>{
    if(!q) return true;
    return [x.number,x.toName,x.fromName,x.toPhone,x.fromPhone].some(v=>String(v||"").toLowerCase().includes(q));
  }).slice(0,10);
  return head("Продлить срок","Найдите сертификат — по номеру или имени")+`
  <label class="f"><span>Номер или имя</span><input class="in" data-k="e-q" id="e-q" data-act="fq" value="${esc(m.q||"")}" placeholder="1, MB-0001 или имя"></label>
  ${pick.length? '<div class="clist" style="border-top:0">'+pick.map(x=>{ const s2=statusOf(x);
      return `<button class="crow s-${s2}" data-act="epick" data-id="${esc(x.id)}">

        <span><span class="nm">${esc(x.toName||"Без имени")}</span>

      </button>`; }).join("")+'</div>'
    : '<p class="tiny">Ничего не нашлось.</p>'}`;
}

/* ---------- события ---------- */
function val(id){ const el=document.getElementById(id); return el?el.value.trim():""; }
function numval(id){ return Math.round(Number(String(val(id)).replace(/[^\d.]/g,""))||0); }

document.addEventListener("click", async ev=>{
  const t = ev.target.closest("[data-act]"); if(!t) return;
  const a = t.dataset.act;
  if(a==="scrim" && ev.target!==t) return;
  if(S.busy && ["dosell","doredeem","dosignup","dologin"].includes(a)) return;
  try{
    if(a==="gtab"){ S.gate.tab=t.dataset.t; S.gate.err=""; render(); return; }
    if(a==="dologin"){
      const login=val("l-login").toLowerCase(), pass=val("l-pass");
      const p = S.staff.find(s=>String(s.login||"").toLowerCase()===login);
      if(!p || p.active===false){ S.gate.err="Такого логина нет или доступ отключён."; render(); return; }
      if(await hashPass(pass, p.id) !== p.passHash){ S.gate.err="Неверный пароль."; render(); return; }
      S.me=p; ss("mb_uid",p.id); S.gate.err=""; render(); return;
    }
    if(a==="dosignup"){
      const name=val("su-name"), login=val("su-login").toLowerCase(), pass=val("su-pass"), pass2=val("su-pass2");
      if(name.length<2){ S.gate.err="Укажите имя и фамилию."; render(); return; }
      if(login.length<3 || login.length>30 || /\s/.test(login)){ S.gate.err="Логин — от 3 до 30 знаков, без пробелов. Можно почту или имя."; render(); return; }
      if(S.staff.some(s=>String(s.login||"").toLowerCase()===login)){ S.gate.err="Такой логин уже занят."; render(); return; }
      if(!/^\d{6}$/.test(pass)){ S.gate.err="Пароль — ровно 6 цифр."; render(); return; }
      if(pass!==pass2){ S.gate.err="Пароли не совпадают."; render(); return; }
      if(S.staff.length>0){
        const need = String(cfg("signupCode")||"").trim().toUpperCase();
        if(need && val("su-code").toUpperCase()!==need){ S.gate.err="Неверный код доступа."; render(); return; }
      }
      S.busy=true;
      const id = safeId("u"+Date.now().toString(36));
      const role = S.staff.length===0 ? "owner" : "admin";
      await S.db.doc("staff/"+id).set({name, login, branch:val("su-branch"), role,
        passHash:await hashPass(pass,id), active:true, createdAt:new Date().toISOString()});
      if(!S.settings) await saveSettings({});
      ss("mb_uid",id); S.me = {id, name, login, branch:val("su-branch"), role};
      await writeLog("Регистрация", name+" · "+branchName(val("su-branch"))+" · логин "+login);
      S.busy=false; flash("Доступ создан"); return;
    }
    if(a==="logout"){ S.me=null; ss("mb_uid",null); S.gate={tab:"login",err:""}; closeModal(); render(); return; }
    if(a==="theme"){
      const cur = document.documentElement.getAttribute("data-theme");
      const dark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark?"light":"dark"); ls("mb_theme", dark?"light":"dark"); return;
    }
    if(a==="nav"){ S.view=t.dataset.v; closeModal(); render(); window.scrollTo(0,0); return; }
    if(a==="per"){ S.period=t.dataset.p; render(); return; }
    if(a==="det"){ S.det=!S.det; render(); return; }
    if(a==="applyper"){ S.from=val("p-from"); S.to=val("p-to"); render(); return; }
    if(a==="fst"){ S.fStatus=t.dataset.s; render(); return; }
    if(a==="fbr"){ S.fBranch=t.dataset.b; render(); return; }
    if(a==="csv"){ await exportCsv(); return; }
    if(a==="close"||a==="scrim"){ closeModal(); return; }
    if(a==="open"){ openModal({type:"cert", id:t.dataset.id}); return; }
    if(a==="sell"){ openModal({type:"sell"}); return; }
    if(a==="redeem"){ openModal({type:"redeem", id:t.dataset.id||"", q:""}); return; }
    if(a==="rpick"){ S.modal.id=t.dataset.id; S.modal.q=""; S.modal.err=""; renderModal(true); return; }
    if(a==="more2"){
      S.modal.more = !S.modal.more;
      S.modal.keep = {nominal:val("f-nominal"), from:val("f-from"), to:val("f-to")};
      renderModal(true);
      const k=S.modal.keep;
      if(document.getElementById("f-nominal")) document.getElementById("f-nominal").value=k.nominal;
      if(document.getElementById("f-from")) document.getElementById("f-from").value=k.from;
      if(document.getElementById("f-to")) document.getElementById("f-to").value=k.to;
      return;
    }
    if(a==="nom"){ const el=document.getElementById("f-nominal"); if(el) el.value=t.dataset.v; return; }
    if(a==="ramt"){ const el=document.getElementById("r-amt"); if(el) el.value=t.dataset.v; return; }

    if(a==="dosell"){
      const nominal=numval("f-nominal");
      if(nominal<=0){ S.modal.err="Укажите номинал сертификата."; renderModal(true); return; }
      S.busy=true; t.disabled=true;
      const no = await doSell({nominal, fromName:val("f-from"), fromPhone:val("f-fromph"),
        toName:val("f-to"), toPhone:val("f-toph"), branch:val("f-branch"), expiresAt:val("f-exp"), note:val("f-note")});
      S.busy=false; closeModal(); flash("Сертификат "+no+" продан"); return;
    }
    if(a==="doredeem"){
      const c = S.certs.find(x=>x.id===t.dataset.id), amt = numval("r-amt");
      if(amt<=0){ S.modal.err="Укажите сумму списания."; renderModal(true); return; }
      S.busy=true; t.disabled=true;
      try{
        const left = await doRedeem(c, amt, val("r-branch"), val("r-note"));
        S.busy=false; closeModal();
        flash(left>0 ? "Списано "+money(amt)+", остаток "+money(left) : "Сертификат погашен полностью");
      }catch(e){ S.busy=false; S.modal.err=e.message||"Не удалось провести операцию"; renderModal(true); }
      return;
    }
    if(a==="void"){
      const c = S.certs.find(x=>x.id===t.dataset.id);
      if(!confirm("Аннулировать сертификат "+c.number+"? Остаток сгорит.")) return;
      await S.db.doc("certs/"+c.id).update({status:"void", voidedAt:new Date().toISOString(), voidedByName:S.me.name});
      await writeLog("Аннулирование", c.number+" · сгорел остаток "+money(c.balance));
      flash("Сертификат аннулирован"); renderModal(true); return;
    }
    if(a==="pass"){ openModal({type:"pass"}); return; }
    if(a==="role"){
      if(S.me.role!=="owner"){ flash("Назначать может только директор", true); return; }
      const p = S.staff.find(x=>x.id===t.dataset.id);
      const owners = S.staff.filter(x=>x.role==="owner" && x.active!==false).length;
      if(p.role==="owner" && owners<=1){ flash("Это последний директор — снять роль нельзя", true); return; }
      const to = p.role==="owner" ? "admin" : "owner";
      if(!confirm(to==="owner" ? "Сделать "+p.name+" директором? Она получит полный отчёт, журнал, настройки и право увольнять."
        : "Снять с "+p.name+" роль директора? Останется администратором.")) return;
      await S.db.doc("staff/"+p.id).update({role:to});
      await writeLog(to==="owner"?"Назначен директор":"Снята роль директора", p.name);
      flash(to==="owner"?p.name+" — директор":p.name+" — администратор"); return;
    }
    if(a==="resetpass"){
      if(S.me.role!=="owner"){ flash("Сбросить пароль может только директор", true); return; }
      const p = S.staff.find(x=>x.id===t.dataset.id);
      const code = String(Math.floor(100000+Math.random()*900000));
      await S.db.doc("staff/"+p.id).update({passHash: await hashPass(code, p.id), mustChange:true, active:true});
      await writeLog("Сброс пароля", p.name);
      openModal({type:"reset", name:p.name, login:p.login, code}); return;
    }
    if(a==="dopass"){
      const p1=val("pw-1"), p2=val("pw-2");
      if(!/^\d{6}$/.test(p1)){ S.modal.err="Пароль — ровно 6 цифр."; renderModal(true); return; }
      if(p1!==p2){ S.modal.err="Пароли не совпадают."; renderModal(true); return; }
      await S.db.doc("staff/"+S.me.id).update({passHash: await hashPass(p1, S.me.id), mustChange:false});
      await writeLog("Смена пароля", S.me.name);
      closeModal(); flash("Пароль изменён"); return;
    }
    if(a==="findedit"){ if(S.me.role!=="owner"){ flash("Продлить срок может только директор", true); return; } openModal({type:"find", q:""}); return; }
    if(a==="epick"){ openModal({type:"edit", id:t.dataset.id}); return; }
    if(a==="edit"){ if(S.me.role!=="owner"){ flash("Изменить может только директор", true); return; } openModal({type:"edit", id:t.dataset.id}); return; }
    if(a==="addm"){
      const el=document.getElementById("e-exp"); if(!el) return;
      const base = el.value ? new Date(el.value) : new Date();
      const from = isNaN(base) || base < new Date() ? new Date() : base;
      el.value = isoDate(addMonths(from, Number(t.dataset.m)||12)); return;
    }
    if(a==="savecode"){
      const code = val("s-code").trim();
      if(code.length<4){ flash("Код — не короче четырёх знаков", true); return; }
      await saveSettings({signupCode:code});
      await writeLog("Изменён код регистрации", "");
      flash("Код сохранён"); return;
    }
    if(a==="doedit"){
      const c = S.certs.find(x=>x.id===t.dataset.id);
      const exp = val("e-exp");
      if(!/^\d{4}-\d{2}-\d{2}$/.test(exp)){ S.modal.err="Укажите дату окончания."; renderModal(true); return; }
      const patch = {expiresAt:exp};
      const br = val("e-branch");
      if(br) patch.soldBranch = br;
      await S.db.doc("certs/"+c.id).update(patch);
      const parts = [];
      if(!c.expiresAt || isoDate(c.expiresAt)!==exp) parts.push("срок "+(c.expiresAt?dt(c.expiresAt):"—")+" → "+dt(exp));
      if(br && br!==c.soldBranch) parts.push("филиал "+branchName(c.soldBranch)+" → "+branchName(br));
      if(parts.length) await writeLog("Изменение сертификата", c.number+" · "+parts.join(", "));
      closeModal(); flash("Сохранено: срок до "+dt(exp)); return;
    }
    if(a==="mybranch"){
      const v = val("my-branch");
      await S.db.doc("staff/"+S.me.id).update({branch:v});
      flash("Филиал изменён"); return;
    }
    if(a==="delstaff"){
      const s = S.staff.find(x=>x.id===t.dataset.id);
      if(!confirm("Уволить "+s.name+"? Вход закроется и человек исчезнет из списка. Проданные ею сертификаты и все записи в журнале останутся.")) return;
      await S.db.doc("staff/"+s.id).delete();
      await writeLog("Удалён сотрудник", s.name+" · "+branchName(s.branch));
      flash("Удалено"); return;
    }
    if(a==="togglestaff"){
      const s = S.staff.find(x=>x.id===t.dataset.id);
      await S.db.doc("staff/"+s.id).update({active: s.active===false});
      await writeLog(s.active===false?"Доступ включён":"Доступ отключён", s.name);
      flash(s.active===false?"Доступ включён":"Доступ отключён"); return;
    }
    if(a==="savenum"){
      await saveSettings({validityMonths:Math.max(1,numval("s-val")||12)});
      flash("Сохранено"); return;
    }
  }catch(e){
    S.busy=false;
    const msg = (e && e.message) || (e && e.code) || "Что-то пошло не так";
    if(S.modal){ S.modal.err=msg; renderModal(true); } else { S.gate.err=msg; flash(msg, true); render(); }
  }
});

  if(t.dataset.act==="rq"){ S.modal.q=t.value; S.modal.id=""; renderModal(true); }

});
document.addEventListener("change", async e=>{
  const t = e.target.closest('[data-act="setbranch"]'); if(!t) return;
  try{
    const p = S.staff.find(x=>x.id===t.dataset.id);
    await S.db.doc("staff/"+p.id).update({branch:t.value});
    await writeLog("Смена филиала сотрудника", p.name+": "+branchName(p.branch)+" → "+branchName(t.value));
    flash(p.name+" — "+branchName(t.value));
  }catch(err){ flash("Не удалось изменить филиал", true); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && S.modal) closeModal();
  if(e.key==="Enter" && !S.me){
    const b = document.querySelector('[data-act="dologin"], [data-act="dosignup"]');
    if(b) b.click();
  }
});
(function init(){ const th = ls("mb_theme"); if(th) document.documentElement.setAttribute("data-theme", th); boot(); })();
</script>
</body>
